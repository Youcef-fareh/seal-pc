name: Windows desktop build

on:
  push:
    branches: [main, master]
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew*"
      - "gradle/**"
      - "src/**"
      - ".github/workflows/build.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew*"
      - "gradle/**"
      - "src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package Windows installers
        run: .\gradlew.bat test packageExe packageMsi "-PappVersion=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: seal-desktop-windows-installers
          path: |
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/msi/*.msi
      - name: Publish installers to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/msi/*.msi
